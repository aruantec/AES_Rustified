name: Build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os == 'ubuntu-24.04' && 'Linux-24.04' || matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get install -y --no-install-recommends \
            build-essential pkg-config libclang-dev \
            libasound2-dev libudev-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgbm-dev libdrm-dev \
            libseat-dev libinput-dev libpixman-1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/AES-Oxide.exe -DestinationPath AES-Oxide-windows-x64.zip

      - name: Package AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          curl -sSfL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          # linuxdeploy deploys the icon under its own basename — it
          # must match the desktop file's Icon= entry.
          cp assets/AES.png aes-oxide.png
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable target/release/AES-Oxide \
            --desktop-file packaging/aes-oxide.desktop \
            --icon-file aes-oxide.png \
            --output appimage
          mv ./*-x86_64.AppImage AES-Oxide-Linux-x86_64.AppImage

      - name: Upload Windows zip
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: AES-Oxide-windows-x64
          path: AES-Oxide-windows-x64.zip

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: AES-Oxide-Linux-x86_64
          path: AES-Oxide-Linux-x86_64.AppImage
