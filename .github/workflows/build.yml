name: Build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os == 'ubuntu-24.04' && 'Linux-24.04' || matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 30
        # Retried: azure.archive.ubuntu.com occasionally stalls a
        # package download mid-run — Acquire timeouts force a retry
        # instead of the step hanging until its timeout.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update \
              -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 && \
              sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
              apt-get install -y --no-install-recommends \
              -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 \
              build-essential pkg-config libclang-dev \
              libasound2-dev libudev-dev \
              libwayland-dev wayland-protocols \
              libxkbcommon-dev libxkbcommon-x11-dev \
              libegl1-mesa-dev libgles2-mesa-dev libgbm-dev libdrm-dev \
              libseat-dev libinput-dev libpixman-1-dev \
              libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
              libxcb-xfixes0-dev libxcb-xkb-dev; then
              exit 0
            fi
            echo "::warning::apt install attempt $attempt failed — retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/AES-Oxide.exe -DestinationPath AES-Oxide-windows-x64.zip

      - name: Package AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          curl -sSfL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          # linuxdeploy deploys the icon under its own basename — it
          # must match the desktop file's Icon= entry.
          cp assets/AES.png aes-oxide.png
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable target/release/AES-Oxide \
            --desktop-file packaging/aes-oxide.desktop \
            --icon-file aes-oxide.png \
            --output appimage
          mv ./*-x86_64.AppImage AES-Oxide-Linux-x86_64.AppImage

      - name: Upload Windows zip
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: AES-Oxide-windows-x64
          path: AES-Oxide-windows-x64.zip

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: AES-Oxide-Linux-x86_64
          path: AES-Oxide-Linux-x86_64.AppImage
