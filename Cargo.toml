[package]
name = "aes_rustified"
version = "0.1.0"
edition = "2021"
description = "AES Lacrima [Rust]"

# The shipped binary is AES-Rustified.exe — the package name stays a
# normal crate identifier.
[[bin]]
name = "AES-Rustified"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg"] }
resvg = { version = "0.45.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio stack: decode -> resample -> ring buffer -> output, with EQ and
# spectrum taps as pipeline stages.
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.16"
ringbuf = "0.4"
rustfft = "6"
rubato = "0.16"

# Library/metadata: embedded cover art extraction, image decode for
# cover textures, native folder picker for "Add music folder".
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.15"
# GLSL -> WGSL translation for the Shadertoy .frag collection (same
# naga wgpu already uses internally).
naga = { version = "30", features = ["glsl-in", "wgsl-out"] }
# Direct dep only to enable static-dxc: links DXC into the exe so
# DX12 shader compiles are ~5x faster than the FXC fallback without
# shipping a dxcompiler.dll alongside the binary.
wgpu = { version = "30.0.1", features = ["static-dxc"] }
ureq = "3.4.2"
sha2 = "0.10"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.24.0"
flate2 = "1.1.10"

# Native Windows Graphics Capture for emulator frame capture (the
# WgcBridge-equivalent path — WinRT WGC + D3D11 staging readback) plus
# the Win32 window plumbing the emulator handlers need.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
