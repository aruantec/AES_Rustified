[package]
name = "aes_rustified"
version = "0.1.0"
edition = "2024"
description = "AES Oxide"

# The shipped binary is AES-Oxide.exe — the package name stays a
# normal crate identifier.
[[bin]]
name = "AES-Oxide"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "7.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
resvg = { version = "0.45.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio stack: decode -> resample -> ring buffer -> output, with EQ and
# spectrum taps as pipeline stages.
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
ringbuf = "0.5"
rustfft = "6"
rubato = "5.0"

# Library/metadata: embedded cover art extraction, image decode for
# cover textures, native folder picker for "Add music folder".
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.17"
# GLSL -> WGSL translation for the Shadertoy .frag collection (same
# naga wgpu already uses internally).
naga = { version = "30", features = ["glsl-in", "wgsl-out"] }
# Direct dep for the Shadertoy/capture pipelines. static-dxc is
# Windows-only (DXC exists to speed up DX12 shader compiles — the
# capture embed only runs on DX12 anyway).
wgpu = "30.0.1"
ureq = "3.4.2"
sha2 = "0.11"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.24.0"
flate2 = "1.1.10"
md-5 = "0.11"
sha1 = "0.11"
crc32fast = "1"
encoding_rs = "0.8"

# Color emoji: seguiemj's COLR paints (Win11) / CBDT strikes (Win10)
# rasterized to textures — egui's glyph atlas is alpha-only.
skrifa = "0.48"
tiny-skia = "0.11"
read-fonts = "0.45"
raw-window-handle = "0.6"
serde_norway = "0.9.42"

# POSIX kill()/SIGSTOP/SIGCONT for session stop+pause on unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Nested Wayland compositor for emulator capture — the emulator runs
# as a client of an in-app compositor and we get each committed frame
# as a dmabuf/shm buffer directly (no compositor round-trip, no portal
# permission dialog). GBM+EGL gives the headless GLES context used to
# read client buffers; XWayland covers X11-only emulators.
smithay = { version = "0.7.0", default-features = false, features = [
    "wayland_frontend",
    "backend_egl",
    "backend_gbm",
    "renderer_gl",
    "renderer_pixman",
    "desktop",
    "xwayland",
    "use_system_lib",
] }
calloop = "0.14"
# wl_drm global for XWayland glamor (device discovery + prime buffers).
# Generated bindings need wayland-server in scope; the scanner proc
# macro reads protocols/wayland-drm.xml at compile time.
wayland-server = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
# Raw client-side protocol calls (wl_subsurface mini window) on
# winit's own wl_display — resolved via dlopen handle, no link dep.
wayland-sys = { version = "0.31", features = ["client"] }

# Native Windows Graphics Capture for emulator frame capture (the
# WgcBridge-equivalent path — WinRT WGC + D3D11 staging readback) plus
# the Win32 window plumbing the emulator handlers need.
[target.'cfg(windows)'.dependencies]
# Direct dep only to enable static-dxc: links DXC into the exe so
# DX12 shader compiles are ~5x faster than the FXC fallback without
# shipping a dxcompiler.dll alongside the binary.
wgpu = { version = "30.0.1", features = ["static-dxc"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[build-dependencies]
flate2 = "1.1.10"

# First-launch cost scales with exe size (Defender scans the whole
# file on a new binary) — thin LTO + symbol strip shave several MB.
[profile.release]
lto = "thin"
strip = "symbols"


